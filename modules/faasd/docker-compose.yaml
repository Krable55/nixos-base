version: "3.7"
services:
  gateway:
    image: ghcr.io/openfaas/gateway:0.27.12
    environment:
      - basic_auth=true
      - functions_provider_url=http://faasd-provider:8081/
      - direct_functions=false
      - read_timeout=60s
      - write_timeout=60s
      - upstream_timeout=65s
      - faas_nats_address=nats
      - faas_nats_port=4222
      - secret_mount_path=/var/secrets
      - scale_from_zero=true
      - function_namespace=openfaas-fn
    volumes:
      - type: bind
        source: /var/lib/faasd/secrets/basic-auth-user
        target: /var/secrets/basic-auth-user
      - type: bind
        source: /var/lib/faasd/secrets/basic-auth-password
        target: /var/secrets/basic-auth-password
    networks:
      - openfaas
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - nats
      - prometheus
    deploy:
      placement:
        constraints:
          - "node.platform.os == linux"

  nats:
    image: docker.io/library/nats-streaming:0.25.6
    command:
      - "/nats-streaming-server"
      - "-m"
      - "8222"
      - "--store=memory"
      - "--cluster_id=faas-cluster"
    networks:
      - openfaas
    deploy:
      placement:
        constraints:
          - "node.platform.os == linux"

  prometheus:
    image: docker.io/prom/prometheus:v2.45.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=0.0.0.0:9090'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    networks:
      - openfaas
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      placement:
        constraints:
          - "node.platform.os == linux"

networks:
  openfaas:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

configs:
  prometheus_config:
    name: prometheus_config
    file: ./prometheus.yml